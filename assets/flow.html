<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Pay Labelling Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Firefly III Apple Pay labeller</p>
    <h1>From a tap to a labelled transaction</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
      <title id="flow-title">From a tap to a labelled transaction</title>
      <desc id="flow-desc">An Apple Pay tap is posted to Firefly III by an iOS Shortcut; Firefly's webhook sends it to the AI service, which classifies it with a local Ollama model, updates the transaction, and pings Discord when unsure so your reply can correct it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-both" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors precede nodes. -->
      <path d="M192,176 H288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M432,164 H528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M528,188 H432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M672,176 H768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-both)" marker-end="url(#arrow-both)"/>
      <path d="M576,208 V320" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M624,320 V208" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels: opaque masks, 8px clear of their connector. -->
      <rect x="204" y="156" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="164" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">IOS SHORTCUT</text>
      <rect x="452" y="144" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>
      <rect x="452" y="196" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="204" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">UPDATES</text>
      <rect x="688" y="156" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="720" y="164" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CLASSIFY</text>
      <rect x="484" y="256" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="564" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing="0.06em">UNSURE OR NEW</text>
      <rect x="632" y="256" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="636" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="start" letter-spacing="0.06em">YOUR REPLY</text>

      <!-- Nodes: paper mask, then styled box. -->
      <rect x="48" y="148" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="148" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Apple Pay tap</text>
      <text x="120" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">iPhone</text>

      <rect x="288" y="144" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="144" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Firefly III</text>
      <text x="360" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">ledger</text>

      <rect x="528" y="144" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="144" width="144" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="600" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">AI service</text>
      <text x="600" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">labeller</text>

      <rect x="768" y="148" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="148" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="840" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Ollama</text>
      <text x="840" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">local LLM</text>

      <rect x="528" y="320" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="320" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="600" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Discord ping</text>

      <!-- Legend strip -->
      <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="516" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="152" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FOCAL</text>
      <rect x="216" y="516" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/><text x="240" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">SERVICE</text>
      <rect x="316" y="516" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="340" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">STORE</text>
      <rect x="404" y="516" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/><text x="428" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">INPUT</text>
      <rect x="492" y="516" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/><text x="516" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">EXTERNAL</text>
      <line x1="600" y1="524" x2="632" y2="524" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/><text x="640" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">ONLY WHEN IT ASKS YOU</text>
    </svg>
  </div>
</body>
</html>
